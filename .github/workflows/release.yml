name: Prepare FastNSA QGIS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastnsa-qgis-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'fastnsa/FastNSA-QGIS'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release metadata and tag
        id: version
        run: python qgis/release_plugin.py preflight --github-output "$GITHUB_OUTPUT"
      - name: Require tagged commit on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  checks:
    needs: preflight
    uses: ./.github/workflows/multiplatform.yml
    permissions:
      contents: read

  assemble:
    needs: [preflight, checks]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: fastnsa-qgis-*
          path: packages
      - name: Assemble verified release bundle
        run: >-
          python qgis/release_plugin.py assemble --input-dir packages --output-dir release
          --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF"
      - uses: actions/upload-artifact@v4
        with:
          name: fastnsa-qgis-release-${{ needs.preflight.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 90

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, assemble]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: fastnsa-qgis-release-${{ needs.preflight.outputs.version }}
          path: release
      - name: Recheck release bundle
        run: >-
          python qgis/release_plugin.py verify --bundle-dir release
          --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF"
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          gh release create "$RELEASE_TAG" release/*.zip release/*.sha256
          release/*.json release/SHA256SUMS release/RELEASE_NOTES.md
          --verify-tag --draft --title "FastNSA for QGIS $RELEASE_VERSION"
          --notes-file release/RELEASE_NOTES.md
