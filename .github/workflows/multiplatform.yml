name: QGIS plugin checks and packages

on:
  pull_request:
  push:
    branches: [main, master, "release/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  packaging-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/packaging -t . -v

  source-only-package:
    name: Source-only QGIS repository candidate
    needs: packaging-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build without a native runtime
        run: python qgis/package_plugin.py --distribution external --output-dir source-dist
      - name: Check source structure and dependency-free entry
        shell: bash
        run: python qgis/validate_package.py source-dist/*.zip --expect-distribution external
      - name: Install pinned security tools
        run: python -m pip --isolated install --requirement qgis/security-requirements.txt
      - name: Scan the final source-only ZIP
        id: security-precheck
        shell: bash
        run: >-
          python qgis/scan_package.py source-dist/*.zip --output-dir source-security-reports
          --expected-source-commit "$GITHUB_SHA"
      - name: Upload security summary without raw code or secret findings
        if: ${{ always() && steps.security-precheck.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: fastnsa-source-security-report
          path: source-security-reports/summary.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: fastnsa-official-repository-candidate
          path: source-dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Explain source-only download
        shell: bash
        run: |
          printf '%s\n' \
            '## Source-only acceptance package' \
            'Download **fastnsa-official-repository-candidate** from this run.' \
            'Extract the Actions download, then install the inner `fastnsa_qgis-*-qgis-repository.zip` in QGIS.' \
            'This package requires external fastnsa==0.3.0. It is not yet an approved official-repository release.' \
            'Use a separate clean QGIS profile from the bundled-package test.' \
            'Security summary: **fastnsa-source-security-report** (includes the ZIP SHA-256 and source commit).' \
            'Style warnings are retained; this precheck does not replace official security scanning or approval.' \
            "Built from commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  qgis-package:
    name: QGIS package / ${{ matrix.name }}
    needs: packaging-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: fastnsa-qgis-linux-x86_64
          - name: Windows AMD64
            os: windows-latest
            artifact: fastnsa-qgis-windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate hash-locked runtime requirement
        shell: bash
        run: |
          python qgis/release_plugin.py requirement --output runtime-requirement.txt
      - name: Download published runtime wheel
        run: >-
          python -m pip --isolated download --index-url https://pypi.org/simple
          --only-binary=:all: --no-deps --require-hashes --dest wheelhouse
          --requirement runtime-requirement.txt
      - name: Install runtime validation dependency
        run: python -m pip install --only-binary=numpy "numpy==1.26.4"
      - name: Build plugin from the pinned wheel
        shell: bash
        run: python qgis/package_plugin.py --wheel wheelhouse/*.whl --output-dir dist
      - name: Validate isolated plugin runtime
        shell: bash
        run: python qgis/validate_package.py dist/*.zip --expect-distribution bundled
      - name: Validate source-only archive with the external pinned runtime
        shell: bash
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/fastnsa-external-check" wheelhouse/*.whl
          python qgis/package_plugin.py --distribution external --output-dir dist/external
          python qgis/validate_package.py dist/external/*.zip --expect-distribution external --external-runtime-root "$RUNNER_TEMP/fastnsa-external-check"
      - name: Upload external-runtime validation report
        uses: actions/upload-artifact@v4
        with:
          name: fastnsa-external-runtime-check-${{ matrix.os }}
          path: dist/external/*.validation.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Explain bundled download
        shell: bash
        env:
          PACKAGE_ARTIFACT: ${{ matrix.artifact }}
        run: |
          printf '%s\n' \
            '## Self-contained acceptance package' \
            "Download **$PACKAGE_ARTIFACT** from this run for this platform." \
            'Extract the Actions download, then install the inner `fastnsa_qgis-*.zip` in QGIS.' \
            'FastNSA is bundled; QGIS must already provide compatible NumPy.' \
            'The source-only ZIP is available separately as **fastnsa-official-repository-candidate**.' \
            'External-runtime reports are automated backend checks, not manual QGIS GUI acceptance.' \
            "Built from commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
