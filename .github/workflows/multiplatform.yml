name: QGIS plugin checks and packages

on:
  pull_request:
  push:
    branches: [main, master, "release/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  packaging-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/packaging -t . -v

  qgis-package:
    name: QGIS package / ${{ matrix.name }}
    needs: packaging-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: fastnsa-qgis-linux-x86_64
          - name: Windows AMD64
            os: windows-latest
            artifact: fastnsa-qgis-windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate hash-locked runtime requirement
        shell: bash
        run: |
          python qgis/release_plugin.py requirement --output runtime-requirement.txt
      - name: Download published runtime wheel
        run: >-
          python -m pip --isolated download --index-url https://pypi.org/simple
          --only-binary=:all: --no-deps --require-hashes --dest wheelhouse
          --requirement runtime-requirement.txt
      - name: Install runtime validation dependency
        run: python -m pip install --only-binary=numpy "numpy==1.26.4"
      - name: Build plugin from the pinned wheel
        shell: bash
        run: python qgis/package_plugin.py --wheel wheelhouse/*.whl --output-dir dist
      - name: Validate isolated plugin runtime
        shell: bash
        run: python qgis/validate_package.py dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.json
          if-no-files-found: error
          retention-days: 30
